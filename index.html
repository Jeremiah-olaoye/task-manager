<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-4 text-primary">Task Tracker</h1>

                <!-- Task Input Form -->
                <div class="input-group mb-3">
                    <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." aria-label="Task name">
                    <button id="addBtn" class="btn btn-primary">Add Task</button>
                </div>

                <!-- Filters -->
                <div class="btn-group w-100 mb-3" role="group">
                    <button class="btn btn-outline-secondary active" id="btn-all" onclick="filterTasks('all')">All</button>
                    <button class="btn btn-outline-secondary" id="btn-active" onclick="filterTasks('active')">Active</button>
                    <button class="btn btn-outline-secondary" id="btn-completed" onclick="filterTasks('completed')">Completed</button>
                </div>

                <!-- Counts Badge Bar -->
                <div class="d-flex justify-content-between mb-3 text-muted small">
                    <span>Total Tasks: <span id="totalCount" class="badge bg-secondary">0</span></span>
                    <span>Completed: <span id="completedCount" class="badge bg-success">0</span></span>
                </div>

                <!-- Task List Area -->
                <ul id="taskList" class="list-group">
                    <!-- Tasks will be injected here dynamically -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (Optional for dropdowns/modals if needed later) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
